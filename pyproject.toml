[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rix-scrcpy"
dynamic = ["version"]
description = "RIX Scrcpy — a feature-complete GUI/TUI/CLI control center for scrcpy"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "hanchenzichen" }]
keywords = ["scrcpy", "android", "adb", "gui", "tui", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: Qt",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Utilities",
]
dependencies = ["PySide6>=6.6,<6.10"]

[project.optional-dependencies]
tui = ["textual>=0.60"]
dev = ["pyinstaller>=6.0", "pytest>=7.0"]

[project.scripts]
rix-scrcpy = "rix.cli:main"
rix-scrcpy-gui = "main:main"

[project.urls]
Homepage = "https://github.com/hanchenzichen/RIXHC_scrcpy-GUI"
Issues = "https://github.com/hanchenzichen/RIXHC_scrcpy-GUI/issues"

[tool.setuptools]
packages = ["rix", "rix.tui"]
py-modules = ["main"]

[tool.setuptools.dynamic]
version = { attr = "rix.__version__" }

[tool.setuptools.package-data]
rix = ["data/*.json"]
